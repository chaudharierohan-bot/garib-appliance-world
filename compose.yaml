services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes: ["db_data:/var/lib/mysql"]
    healthcheck:
      test: [CMD-SHELL, "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h localhost -u wordpress --silent"]
      interval: 5s
      retries: 30
  wordpress:
    image: wordpress:6.8.3-php8.3-apache
    ports: ["127.0.0.1:${PORT:-8080}:80"]
    environment: &wp_env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    volumes: &wp_volumes
      - wp_data:/var/www/html
      - ./theme/garib-appliance-world:/var/www/html/wp-content/themes/garib-appliance-world
      - ./scripts:/setup:ro
      - ./.runtime:/artifacts:ro
    depends_on:
      db: {condition: service_healthy}
  cli:
    image: wordpress:cli-php8.3
    user: "33:33"
    environment: *wp_env
    volumes: *wp_volumes
    depends_on: [wordpress]
    profiles: [tools]
volumes:
  db_data:
  wp_data:
